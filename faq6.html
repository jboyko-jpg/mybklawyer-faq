    <text class="f" x="800" y="872" font-size="20" text-anchor="middle" style="font-family:system-ui,Arial,sans-serif;fill:#555">We are a debt relief agency. We help people file for bankruptcy relief under the Bankruptcy Code.</text>
  </g>

  <!-- wipe -->
  <rect id="wipe" x="-1800" y="0" width="1700" height="900" fill="url(#wipeEdge)"/>

  <!-- hand holding a marker; tip at (0,0) -->
  <g id="hand" transform="translate(1800 1100)">
    <g transform="rotate(-28)">
      <path d="M0 0 L-9 24 L9 24 Z" fill="#222"/>
      <rect x="-13" y="22" width="26" height="22" fill="#1f5fa8"/>
      <rect x="-16" y="42" width="32" height="190" rx="8" fill="#2b2b2b"/>
      <rect x="-16" y="120" width="32" height="14" fill="#1f5fa8"/>
      <path d="M-20 70 q-26 6 -22 26 q6 16 30 10 Z" fill="#f2c9a0" stroke="#333" stroke-width="3"/>
      <path d="M-18 98 q-30 8 -24 30 q6 16 32 8 Z" fill="#f2c9a0" stroke="#333" stroke-width="3"/>
      <path d="M-14 126 q-26 10 -18 30 q8 12 30 4 Z" fill="#f2c9a0" stroke="#333" stroke-width="3"/>
      <path d="M14 66 q40 -6 60 30 q30 50 22 110 q-6 50 -40 80 L-30 300 q-20 -40 -10 -80 q6 -40 24 -60 q8 -40 16 -60 Z" fill="#f2c9a0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <path d="M10 80 q20 14 22 40" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <path d="M-40 290 L60 300 L80 520 L-60 520 Z" fill="#1f5fa8" stroke="#333" stroke-width="3"/>
      <path d="M-42 300 L62 310" stroke="#fff" stroke-width="6" opacity=".6"/>
    </g>
  </g>
</svg>
<div class="overlay hidden" id="overlay"><button id="bigPlay" aria-label="Play">▶ Play</button></div>
<button class="endReplay hidden" id="endReplay" aria-label="Replay">↺ Replay</button>
<div class="controls" id="controls">
  <button id="playBtn" aria-label="Play">▶</button>
  <button id="replayBtn" aria-label="Replay">↺<span class="lbl"> Replay</span></button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <span class="time" id="time">0:00 / 0:00</span>
  <button id="ccBtn" aria-pressed="true" title="Captions">CC</button>
  <button id="narrBtn" aria-pressed="false" title="Read the answer aloud (Web Speech)">🔈<span class="lbl"> Narrate</span></button>
</div>
</div>
<div class="cap below" id="cap" aria-live="polite"></div>
</div>
<script>

function boot(){
  "use strict";
  const svg = document.getElementById('svg');
  const hand = document.getElementById('hand');
  const wipe = document.getElementById('wipe');
  const NS = 'http://www.w3.org/2000/svg';
  const defs = svg.querySelector('defs');
  const REST = {x:1820, y:1150};
  const WIPE_OUT = 0.7, WIPE_IN = 0.55, FIRST = 0.65, GAP = 0.08;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  const lerp = (a,b,p)=>({x:a.x+(b.x-a.x)*p, y:a.y+(b.y-a.y)*p});

  const sceneEls = Array.from(svg.querySelectorAll('.scene'));
  sceneEls.forEach(s=>s.style.display='inline');
  const rootInv = svg.getScreenCTM().inverse();
  const toRoot = (el, x, y) => {
    const m = rootInv.multiply(el.getScreenCTM());
    const p = svg.createSVGPoint(); p.x=x; p.y=y;
    const r = p.matrixTransform(m); return {x:r.x, y:r.y};
  };

  let clipId = 0, T0 = 0;
  const scenes = sceneEls.map((g, si) => {
    const items = [];
    let t = FIRST;
    g.querySelectorAll('.d,.w,.f').forEach(el => {
      const it = {el, type: el.classList.contains('d')?'d':el.classList.contains('w')?'w':'f'};
      if (it.type==='d'){
        it.len = el.getTotalLength();
        it.dur = parseFloat(el.dataset.dur) || clamp(it.len/1700, .22, 1.3);
        el.style.strokeDasharray = it.len+' '+it.len;
        it.fill = el.dataset.fill || null;
        if (it.fill){ el.style.fill = it.fill; el.style.fillOpacity = 0; }
        const a = el.getPointAtLength(0), b = el.getPointAtLength(it.len);
        it.p0 = toRoot(el,a.x,a.y); it.p1 = toRoot(el,b.x,b.y);
        it.m = rootInv.multiply(el.getScreenCTM());
      } else if (it.type==='w'){
        let bb = el.getBBox();
        const mw = parseFloat(el.dataset.maxw);
        if (mw && bb.width > mw){
          const fs = parseFloat(el.getAttribute('font-size'));
          el.setAttribute('font-size', (fs*mw/bb.width).toFixed(1));
          bb = el.getBBox();
        }
        it.bb = bb;
        const cp = document.createElementNS(NS,'clipPath');
        cp.id = 'wclip'+(clipId++); cp.setAttribute('clipPathUnits','userSpaceOnUse');
        const r = document.createElementNS(NS,'rect');
        r.setAttribute('x', bb.x-6); r.setAttribute('y', bb.y-30);
        r.setAttribute('height', bb.height+60); r.setAttribute('width', 0);
        cp.appendChild(r); defs.appendChild(cp);
        el.setAttribute('clip-path','url(#'+cp.id+')');
        it.rect = r;
        const chars = el.textContent.trim().length;
        it.dur = parseFloat(el.dataset.dur) || clamp(chars*0.058, .5, 2.6);
        it.m = rootInv.multiply(el.getScreenCTM());
        const P = (x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;const q=p.matrixTransform(it.m);return {x:q.x,y:q.y};};
        it.P = P;
        it.p0 = P(bb.x, bb.y+bb.height*.62); it.p1 = P(bb.x+bb.width, bb.y+bb.height*.62);
      } else {
        it.dur = .8; el.style.opacity = 0;
      }
      it.start = T0 + t;
      it.end = it.start + it.dur;
      t += it.dur + (parseFloat(el.dataset.gap) || GAP);
      items.push(it);
    });
    const sc = {g, items, start:T0, end: T0 + t + (parseFloat(g.dataset.hold)||2),
                cap:g.dataset.cap||'', narr:g.dataset.narr||''};
    sc.draw = items.filter(i=>i.type!=='f');
    T0 = sc.end;
    return sc;
  });
  const TOTAL = T0;

  function handAt(sc, T){
    if (!sc) return REST;
    const W = (T*38);
    for (const it of sc.draw){
      if (T>=it.start && T<it.end){
        const p = (T-it.start)/it.dur;
        if (it.type==='d'){
          const q = it.el.getPointAtLength(it.len*p);
          const pt = svg.createSVGPoint(); pt.x=q.x; pt.y=q.y;
          const r = pt.matrixTransform(it.m); return {x:r.x,y:r.y};
        } else {
          const bb = it.bb;
          return it.P(bb.x + bb.width*p, bb.y + bb.height*(.58 + .2*Math.sin(W)));
        }
      }
    }
    let prev=null, next=null;
    for (const it of sc.draw){ if (it.end<=T) prev=it; else if (it.start>T){ next=it; break; } }
    if (prev && next && next.start-prev.end < 2.2)
      return lerp(prev.p1, next.p0, ease(clamp((T-prev.end)/(next.start-prev.end),0,1)));
    if (next && T > next.start-0.6)
      return lerp(REST, next.p0, ease(clamp((T-(next.start-0.6))/0.6,0,1)));
    if (prev) return lerp(prev.p1, REST, ease(clamp((T-prev.end)/0.7,0,1)));
    return REST;
  }

  let curScene = -1;
  function sceneIndex(T){
    for (let i=0;i<scenes.length;i++) if (T < scenes[i].end) return i;
    return scenes.length-1;
  }

  const capEl = document.getElementById('cap');
  function render(T){
    const si = sceneIndex(T);
    scenes.forEach((sc,i)=>{ sc.g.style.display = (i===si)?'inline':'none'; });
    const sc = scenes[si];
    for (const it of sc.items){
      const p = clamp((T-it.start)/it.dur,0,1);
      if (it.type==='d'){
        it.el.style.strokeDashoffset = it.len*(1-p);
        it.el.style.visibility = p>0 ? 'visible' : 'hidden';
        if (it.fill) it.el.style.fillOpacity = clamp((T-it.end)/0.5,0,1)*0.9;
      } else if (it.type==='w'){
        it.rect.setAttribute('width', p>0 ? (it.bb.width*p + (p>=1?12:0)) : 0);
      } else {
        it.el.style.opacity = p;
      }
    }
    // wipe transition
    let wx = -1800;
    if (si < scenes.length-1 && T > sc.end-WIPE_OUT)
      wx = -1700 + ease(clamp((T-(sc.end-WIPE_OUT))/WIPE_OUT,0,1))*1700;
    else if (si>0 && T < sc.start+WIPE_IN)
      wx = ease(clamp((T-sc.start)/WIPE_IN,0,1))*1700;
    wipe.setAttribute('x', wx.toFixed(1));
    // hand
    let h = handAt(sc,T);
    if (si < scenes.length-1 && T > sc.end-WIPE_OUT) h = REST;
    hand.setAttribute('transform','translate('+h.x.toFixed(1)+' '+h.y.toFixed(1)+')');
    if (si !== curScene){
      curScene = si;
      capEl.textContent = sc.cap;
      if (playing && narrate) speak(sc.narr);
    }
    scrub.value = Math.round(T/TOTAL*1000);
    timeEl.textContent = fmt(T)+' / '+fmt(TOTAL);
  }
  const fmt = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

  // ---- narration (Web Speech API, off by default; browsers block unprompted audio) ----
  let narrate = false;
  const synth = window.speechSynthesis || null;
  function speak(text){
    if (!synth || !text) return;
    try { synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; synth.speak(u); } catch(e){}
  }
  function stopSpeech(){ if (synth) try{ synth.cancel(); }catch(e){} }

  // ---- layout: fit a 16:9 stage into any viewport / iframe size ----
  const player = document.getElementById('player'), stage = document.getElementById('stage');
  let ccOn = null; // null = auto (on when there is room below the stage)
  function layout(){
    const W = document.documentElement.clientWidth || innerWidth, H = document.documentElement.clientHeight || innerHeight;
    const u = Math.min(W, H*16/9)/100;
    const capH = Math.max(34, Math.min(80, u*5.2));
    const roomBelow = H - W*9/16 >= capH;
    const showCap = ccOn===null ? roomBelow : ccOn;
    const below = showCap && roomBelow;
    const sw = Math.max(1, Math.min(W, (H - (below?capH:0))*16/9));
    stage.style.width = sw+'px';
    player.style.setProperty('--u', (sw/100)+'px');
    player.classList.toggle('narrow', sw < 520);
    capEl.classList.toggle('hidden', !showCap);
    capEl.classList.toggle('below', below); capEl.classList.toggle('over', showCap && !below);
    if (showCap && !below) stage.appendChild(capEl); else if (capEl.parentNode!==player) player.appendChild(capEl);
    if (below) capEl.style.width = sw+'px'; else capEl.style.width = '';
    ccBtn.setAttribute('aria-pressed', showCap);
  }

  // ---- clock & controls ----
  const playBtn = document.getElementById('playBtn'), replayBtn = document.getElementById('replayBtn');
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay'), narrBtn = document.getElementById('narrBtn'), ccBtn = document.getElementById('ccBtn');
  let T = 0, playing = false, last = null, started = false, idleTimer = null;
  const endReplay = document.getElementById('endReplay');
  const ended = ()=> !playing && T >= TOTAL;
  function wake(){
    player.classList.remove('idle'); clearTimeout(idleTimer);
    if (playing || ended()) idleTimer = setTimeout(()=>{ if (playing || ended()) player.classList.add('idle'); }, 2500);
  }
  function setPlaying(v){
    playing = v; last = null; if (v) started = true;
    playBtn.textContent = v ? '❚❚' : '▶';
    playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
    overlay.classList.add('hidden');
    endReplay.classList.toggle('hidden', !ended());
    wake();
    if (!v) stopSpeech();
    else if (narrate) speak(scenes[sceneIndex(T)].narr);
  }
  function play(){ if (T>=TOTAL) seek(0); curScene=sceneIndex(T); setPlaying(true); }
  function pause(){ setPlaying(false); }
  function seek(t){ T = clamp(t,0,TOTAL); stopSpeech(); endReplay.classList.add('hidden'); curScene = sceneIndex(T); render(T); capEl.textContent = scenes[curScene].cap; }
  function tick(ts){
    if (playing){
      if (last!==null) T += Math.min(0.1,(ts-last)/1000);
      last = ts;
      if (T >= TOTAL){ T = TOTAL; render(T); setPlaying(false); }   // stop on the end card, no loop
      else render(T);
    }
    requestAnimationFrame(tick);
  }
  playBtn.onclick = ()=> playing ? pause() : play();
  document.getElementById('bigPlay').onclick = (e)=>{ e.stopPropagation(); play(); };
  overlay.onclick = play;
  replayBtn.onclick = endReplay.onclick = ()=>{ seek(0); setPlaying(true); };
  scrub.oninput = ()=> seek(scrub.value/1000*TOTAL);
  narrBtn.onclick = ()=>{
    if (!synth){ narrBtn.title='Narration not supported in this browser'; return; }
    narrate = !narrate; narrBtn.setAttribute('aria-pressed', narrate);
    if (narrate && playing) speak(scenes[sceneIndex(T)].narr); else stopSpeech();
  };
  ccBtn.onclick = ()=>{ ccOn = ccBtn.getAttribute('aria-pressed')!=='true'; layout(); };
  ['pointermove','pointerdown','touchstart','keydown','focusin'].forEach(ev=>player.addEventListener(ev, wake, {passive:true}));
  document.addEventListener('keydown', e=>{ if (e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); playing?pause():play(); }});
  addEventListener('resize', layout);

  layout();
  render(0); capEl.textContent = scenes[0].cap; curScene = 0;
  requestAnimationFrame(tick);

  // ---- autoplay: default on; start when the player is visible (IntersectionObserver works
  // inside cross-origin iframes such as Wix "Embed HTML"). ?autoplay=0 disables it.
  const autoplay = !/[?&]autoplay=(0|false|off)\b/.test(location.search);
  if (!autoplay) overlay.classList.remove('hidden');
  else if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(entries=>{
      if (!started && entries.some(e=>e.isIntersecting && e.intersectionRatio >= 0.5)){ io.disconnect(); play(); }
    }, {threshold:[0, 0.5, 1]});
    io.observe(stage);
  } else play();

  window.WB = { seek, play, pause, get time(){return T;}, get playing(){return playing;}, total:TOTAL,
    scenes: scenes.map(s=>({start:+s.start.toFixed(2), end:+s.end.toFixed(2), cap:s.cap})),
    handPos: ()=>{ const m = hand.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/); return {x:+m[1], y:+m[2]}; } };
  return true;
}

// Measure only once the stage is actually laid out (iframes can load hidden or at 0 size)
(function start(){
  let booted = false;
  const st = document.getElementById('stage');
  function tryBoot(){
    if (booted) return;
    const r = st.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    booted = true; boot();
  }
  const go = ()=>{ tryBoot(); if (!booted && 'ResizeObserver' in window){ const ro = new ResizeObserver(()=>{ tryBoot(); if (booted) ro.disconnect(); }); ro.observe(st); } };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
})();
</script>
</body>
</html>
